name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm install

      - name: Build (server + extension + mcpb)
        run: npm run build:all

      - name: Pack Chrome extension zip
        run: |
          cd extension/dist
          zip -r ../../build/yolo-chrome-mcp-extension-${{ github.ref_name }}.zip .

      - name: Publish to npm
        run: cd server && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Authenticate to Google Cloud
        id: cws-auth
        if: env.CWS_EXTENSION_ID != ''
        uses: google-github-actions/auth@v2
        with:
          create_credentials_file: false
          token_format: access_token
          workload_identity_provider: ${{ vars.CWS_WIF_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Publish to Chrome Web Store
        if: env.CWS_EXTENSION_ID != ''
        run: node scripts/cws-publish.mjs
        env:
          CWS_ACCESS_TOKEN: ${{ steps.cws-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ZIP_PATH: build/yolo-chrome-mcp-extension-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/yolo-chrome-mcp-*.mcpb
            build/yolo-chrome-mcp-extension-*.zip
          generate_release_notes: true
          body: |
            ## Install

            **Claude Code:**
            ```
            claude mcp add --scope user yolo-chrome -- npx -y yolo-chrome-mcp@latest
            npx yolo-chrome-mcp install   # extension load + routing hook + CLAUDE.md rule
            ```

            `--scope user` makes the server available in every project, not just
            the directory you ran the command from.

            **Claude Desktop:** download `yolo-chrome-mcp-*.mcpb` below and drag it onto Claude Desktop.

            **Chrome extension (manual):** download `yolo-chrome-mcp-extension-*.zip`, unzip, load at chrome://extensions → Load unpacked.
